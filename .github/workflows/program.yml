name: Programul cultural (zilnic)

# Citește programele Operei, teatrelor și Filarmonicii din Timișoara (scripts/build-events.ts)
# și publică events.json, pe care aplicația timiGO îl descarcă în fiecare zi.
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/program.yml']

permissions:
  contents: write

concurrency:
  group: program
  cancel-in-progress: false

jobs:
  program:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Citește programele
        run: |
          npx --yes tsx@4 scripts/build-events.ts "$RUNNER_TEMP/events.json" --prev events.json | tee -a "$GITHUB_STEP_SUMMARY"
          node -e "const j=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/events.json','utf8')); if(j.events.length<15){console.error('Prea puține evenimente',j.events.length);process.exit(1)}"
          cp "$RUNNER_TEMP/events.json" events.json
      - name: Publică
        run: |
          git config user.name "timiGO bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet && exit 0
          git commit -m "Programul cultural actualizat"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
